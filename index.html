<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои дети (моя семья)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a080d;
            background: radial-gradient(circle at center, #18121d 0%, #08060a 100%);
            color: #ffffff;
            font-family: 'Noto Serif', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Գաղտնաբառի պատուհան */
        #pass-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a080d;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #pass-screen h2 {
            font-size: 20px;
            color: #f1e7d8;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        #pass-input {
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: #18121d;
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        #pass-btn {
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            background: #d4af37;
            color: #0a080d;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }

        /* Կայքի հիմնական մասը */
        #main-content {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 90vh;
            position: relative;
        }

        /* Վերնագիր */
        .header {
            text-align: center;
            margin-top: 10px;
            z-index: 2;
        }

        .main-title {
            font-size: 28px;
            font-weight: 400;
            font-style: italic;
            color: #f1e7d8;
            line-height: 1.4;
            text-shadow: 0 0 12px rgba(255, 230, 200, 0.15);
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            color: #a39ca8;
            margin-top: 6px;
            font-weight: 300;
        }

        /* Կենտրոնական գիծ */
        .divider-container {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, 
                transparent 0%, 
                rgba(212, 175, 55, 0.3) 30%, 
                rgba(212, 175, 55, 0.6) 50%, 
                rgba(212, 175, 55, 0.3) 70%, 
                transparent 100%);
        }

        .center-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #120e17;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25), inset 0 0 10px rgba(212, 175, 55, 0.1);
            color: #d4af37;
            font-size: 18px;
            font-weight: 600;
        }

        /* Սլայդեր */
        .gallery-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0;
            z-index: 2;
        }

        .slider-box {
            width: 80%;
            max-width: 380px;
            aspect-ratio: 3/4;
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.2);
            cursor: pointer;
        }

        .slider-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            border-radius: 14px;
        }

        .slider-box img.active {
            opacity: 1;
        }

        /* Ներքևի հատված */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #3a3342;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .dot.active {
            background-color: #d4af37;
            transform: scale(1.3);
        }

        /* Ներքևի աջ տեքստը */
        .footer-note {
            width: 100%;
            text-align: right;
            font-size: 13px;
            color: #a39ca8;
            font-style: italic;
            padding-right: 10px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Գաղտնաբառ -->
    <div id="pass-screen">
        <h2>Введите пароль</h2>
        <input type="password" id="pass-input" placeholder="****">
        <button id="pass-btn" onclick="checkPass()">Войти</button>
    </div>

    <!-- Հիմնական էջ -->
    <div id="main-content">
        <div class="header">
            <div class="main-title">Мои дети</div>
            <div class="subtitle">(моя семья)</div>
        </div>

        <div class="divider-container">
            <div class="line"></div>
            <div class="center-circle">❤</div>
        </div>

        <div class="gallery-container">
            <div class="slider-box" id="photo-slider" onclick="nextImage()">
                <img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=600&q=80" class="active" alt="Фото 1">
                <img src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?w=600&q=80" alt="Фото 2">
                <img src="https://images.unsplash.com/photo-1476703993599-0035a21b17a9?w=600&q=80" alt="Фото 3">
                <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?w=600&q=80" alt="Фото 4">
                <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=600&q=80" alt="Фото 5">
            </div>
        </div>

        <div class="bottom-section">
            <div class="dots" id="dots-container">
                <div class="dot active" onclick="setImage(0)"></div>
                <div class="dot" onclick="setImage(1)"></div>
                <div class="dot" onclick="setImage(2)"></div>
                <div class="dot" onclick="setImage(3)"></div>
                <div class="dot" onclick="setImage(4)"></div>
            </div>

            <div class="footer-note">
                Родному человеку от А.М.
            </div>
        </div>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('pass-input').value;
            // Գաղտնաբառը 2222 է
            if (pass === "2222") {
                document.getElementById('pass-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
            } else {
                alert("Неверный пароль");
            }
        }

        document.getElementById('pass-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPass();
            }
        });

        let currentIndex = 0;
        const images = document.querySelectorAll('#photo-slider img');
        const dots = document.querySelectorAll('#dots-container .dot');

        function setImage(index) {
            images[currentIndex].classList.remove('active');
            dots[currentIndex].classList.remove('active');
            currentIndex = index;
            images[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
        }

        function nextImage() {
            let nextIdx = (currentIndex + 1) % images.length;
            setImage(nextIdx);
        }
    </script>

</body>
</html>
